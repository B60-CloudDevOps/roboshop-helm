---
# HPA for the deployment {{ .Values.component.name }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.component.name }}-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.component.name }}
  minReplicas: {{ .Values.minReplicas | default 2 }}
  maxReplicas: {{ .Values.maxReplicas | default 10 }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.cpu.averageUtilization | default 70 }}
